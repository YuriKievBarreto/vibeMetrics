[project]
name = "spotify-analytics"
version = "0.1.0"
description = ""
authors = [
    {name = "Yuri Kiev de Sousa Barreto",email = "yurikievbarreto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.119.0,<0.120.0)",
    "boto3 (>=1.40.55,<2.0.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.44,<3.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "numpy (>=2.3.4,<3.0.0)",
    "matplotlib (>=3.10.7,<4.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "spotipy (>=2.25.1,<3.0.0)",
    "python-dotenv(>=1.1.1)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "sqlmodel>=0.0.39",
    "groq>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
